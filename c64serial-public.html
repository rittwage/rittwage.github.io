<style>
  /* Badge / keyboard pictures in the table */
  .c64-type-img { height: 26px; width: auto; vertical-align: middle; cursor: pointer; }
  .c64-type-other { font-size: .8rem; cursor: pointer; }
  .c64-type-link { display: inline-block; }
  .c64-type-link:hover .c64-type-img { outline: 2px solid #8fa9c9; }
</style>
<script src="https://rittwage.github.io/bootstrap/js/bootstrap.min.js"></script>
<link href="https://rittwage.github.io/bootstrap/bootswatch/slate/bootstrap.css" rel="stylesheet" media="screen">
<link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.18.0/dist/bootstrap-table.min.css">

<div class="container">
  <div class="d-flex justify-content-between align-items-center mt-3 mb-2">
    <span class="text-muted small">Commodore 64 serial registry</span>
    <span>
      <a class="btn btn-sm btn-primary" href="add.html">Add your C64</a>
    </span>
  </div>

  <div id="filter-bar" class="alert alert-secondary d-none align-items-center justify-content-between py-2 mb-2">
    <span id="filter-text" class="small"></span>
    <button type="button" class="btn btn-sm btn-outline-light ml-3" id="clear-filter">Clear filters</button>
  </div>

  <table id="table" width=100% class="table table-bordered table-sm" data-toggle="table" data-flat="true" data-search="true" data-url="c64.json">
    <thead>
      <tr>
        <!--<th data-field="id" data-sortable="true">ID</th>-->
        <th class="small" data-field="owner" data-sortable="true" data-search="true">Owner</th>
        <th class="small" data-field="location" data-sortable="true" data-search="true">Location</th>
        <th class="small" data-field="case_serial_pre" data-sortable="true" data-search="true">PreSerial</th>
        <th class="small" data-field="case_serial" data-sortable="true" data-search="true">Serial</th>
        <th class="small" data-field="badge_type" data-sortable="true" data-search="true" data-formatter="c64BadgeFormatter">BadgeType</th>
        <th class="small" data-field="key_type" data-sortable="true" data-search="true" data-formatter="c64KeyFormatter">KeyType</th>
        <th class="small" data-field="notes" data-sortable="true" data-search="true">Notes</th>
		<!--<th class="small" data-field="timestamp" data-sortable="true">Timestamp</th>-->
      </tr>
    </thead>
  </table>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script src="https://unpkg.com/bootstrap-table@1.18.0/dist/bootstrap-table.min.js"></script>
<script src="c64-types.js"></script>
<script src="c64-filter.js"></script>
<script src="c64-data-loader.js"></script>
